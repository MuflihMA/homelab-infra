version: "3.9"

services:

  postgresql:
    image: postgres:15
    container_name: postgresql
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    env_file: .env
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883"       # MQTT
      - "18083:18083"     # Dashboard

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./data/redis:/data

  mediamtx:
    image: bluenviron/mediamtx
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "${MEDIAMTX_PORT}:8554"         # RTSP
      - "${MEDIAMTX_HLS_PORT}:8888"     # HLS
      - "${MEDIAMTX_WEBRTC_PORT}:8889"  # FIX: WebRTC port 8443 -> 8889 (sesuai mediamtx.yml)
      - "8189:8189/udp"                 # WebRTC local UDP
      - "8189:8189/tcp"                 # WebRTC local TCP
      - "8890:8890/udp"                 # SRT
      - "9997:9997"                     # Control API
      - "9998:9998"                     # Metrics
    volumes:
      - ./data/mediamtx:/var/mediamtx
    command: /var/mediamtx/mediamtx.yml


